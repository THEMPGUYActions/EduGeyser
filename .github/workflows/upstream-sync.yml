name: Synchronize upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/upstream-sync.yml"
      - ".github/workflows/pull-request.yml"
      - ".github/workflows/build-remote.yml"

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      updated: ${{ steps.result.outputs.updated }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream repositories
        run: |
          git remote add edugeyser https://github.com/EduGeyser/EduGeyser.git
          git remote add geysermc https://github.com/GeyserMC/Geyser.git
          git fetch --no-tags edugeyser master
          git fetch --no-tags geysermc master

      - name: Start from the current fork master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/upstream-sync origin/master

      - name: Merge latest EduGeyser commits
        run: |
          if ! git merge --no-edit -X ours edugeyser/master; then
            echo "::error title=EduGeyser upstream merge failed::Inspect the merge output and unresolved paths below."
            git diff --name-only --diff-filter=U || true
            exit 1
          fi

      - name: Merge latest Geyser commits
        run: |
          if ! git merge --no-edit --no-ff -X ours -m "Merge latest GeyserMC/Geyser master" geysermc/master; then
            git merge --abort || true
            echo "::notice::Retrying the Geyser merge with rename detection disabled to avoid false rename conflicts."
            if ! git merge --no-edit --no-ff -X ours -X no-renames -m "Merge latest GeyserMC/Geyser master" geysermc/master; then
              echo "::error title=Geyser upstream merge failed::Inspect the merge output and unresolved paths below."
              git diff --name-only --diff-filter=U || true
              exit 1
            fi
          fi

      - name: Check whether upstream changed
        id: result
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push generated sync branch
        if: steps.result.outputs.updated == 'true'
        run: git push --force origin HEAD:refs/heads/automation/upstream-sync

      - name: Open sync pull request if needed
        if: steps.result.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sync EduGeyser and Geyser upstreams"
          body="$(cat <<'EOF'
          This PR is generated by the upstream synchronization workflow.

          - Merges the latest `EduGeyser/EduGeyser:master`.
          - Merges the latest `GeyserMC/Geyser:master`.
          - Uses Git's `-X ours` strategy, preserving this fork's version at conflicting hunks while accepting non-conflicting upstream changes. If rename-aware merging fails, it retries with rename detection disabled to avoid false rename pairs during the networking refactor.
          - Runs the EduGeyser-required Gradle build on JDK 27.

          The workflow does not push to `master` or auto-merge this PR. Review the diff and passing CI before merging.
          EOF
          )"
          pr_number="$(gh pr list --state open --head automation/upstream-sync --base master --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            echo "Existing sync PR #$pr_number will update automatically when this branch is pushed."
          elif gh pr create --base master --head automation/upstream-sync --title "$title" --body "$body"; then
            echo "Created sync PR."
          else
            echo "::warning::GitHub Actions is not allowed to create pull requests in this repository. The branch has been pushed and validated; open https://github.com/THEMPGUYActions/EduGeyser/compare/master...automation/upstream-sync manually or enable Actions pull-request creation in repository settings."
          fi

      - name: Close stale sync PR when already up to date
        if: steps.result.outputs.updated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --state open --head automation/upstream-sync --base master --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            if ! gh pr close "$pr_number" --comment "The latest upstream commits are already present in master, so this generated sync PR is no longer needed."; then
              echo "::warning::Unable to close the stale sync PR with GITHUB_TOKEN; check repository Actions permissions."
            fi
          fi

  validate:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out generated sync branch
        uses: actions/checkout@v4
        with:
          ref: automation/upstream-sync
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build EduGeyser
        run: ./gradlew build -PrequireBundledExtension
