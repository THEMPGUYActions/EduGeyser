name: Synchronize upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/upstream-sync.yml"
      - ".github/workflows/pull-request.yml"
      - ".github/workflows/build-remote.yml"

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      updated: ${{ steps.result.outputs.updated }}
      preserved: ${{ steps.nethernet.outputs.preserved }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream repositories
        run: |
          git remote add edugeyser https://github.com/EduGeyser/EduGeyser.git
          git remote add geysermc https://github.com/GeyserMC/Geyser.git
          git fetch --no-tags edugeyser master
          git fetch --no-tags geysermc master

      - name: Merge upstreams
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/upstream-sync origin/master
          baseline="$(git rev-parse HEAD)"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

          if ! git merge --no-edit -X ours edugeyser/master; then
            echo "::error title=EduGeyser merge failed::Unresolved paths are listed below."
            git diff --name-only --diff-filter=U || true
            exit 1
          fi

          if ! git merge --no-edit --no-ff -X ours -m "Merge latest GeyserMC/Geyser master" geysermc/master; then
            git merge --abort || true
            echo "::notice::Retrying the Geyser merge with rename detection disabled."
            if ! git merge --no-edit --no-ff -X ours -X no-renames -m "Merge latest GeyserMC/Geyser master" geysermc/master; then
              echo "::error title=Geyser merge failed::Unresolved paths are listed below."
              git diff --name-only --diff-filter=U || true
              exit 1
            fi
          fi

      - name: Preserve EduGeyser's Education NetherNet implementation
        id: nethernet
        env:
          BASELINE: ${{ steps.merge.outputs.baseline }}
        run: |
          # Geyser's built-in NetherNet implementation uses a different transport API
          # than EduGeyser's Education Edition join-code implementation. Do not mix them.
          if [ -d core/src/main/java/org/geysermc/geyser/network/bedrock/nethernet ]; then
            echo "preserved=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found Geyser's separate NetherNet implementation; retaining EduGeyser's existing transport stack."

            git restore --source="$BASELINE" --staged --worktree -- \
              core/src/main/java/org/geysermc/geyser/Constants.java \
              core/src/main/java/org/geysermc/geyser/GeyserImpl.java \
              core/src/main/java/org/geysermc/geyser/command/CommandRegistry.java \
              core/src/main/java/org/geysermc/geyser/configuration/ConfigMigrations.java \
              core/src/main/java/org/geysermc/geyser/configuration/GeyserConfig.java \
              core/src/main/java/org/geysermc/geyser/network/CIDRMatcher.java \
              core/src/main/java/org/geysermc/geyser/util/LoginEncryptionUtils.java \
              core/src/test/java/org/geysermc/geyser/configuration/ConfigLoaderTest.java

            git rm -r --ignore-unmatch -- \
              core/src/main/java/org/geysermc/geyser/network/bedrock/nethernet \
              core/src/main/java/org/geysermc/geyser/command/defaults/NetherNetCommand.java \
              core/src/test/java/org/geysermc/geyser/network/bedrock/nethernet \
              core/src/test/java/org/geysermc/geyser/dump/DumpSecretsTest.java \
              core/src/test/java/org/geysermc/geyser/util/LoginIdentityBindingTest.java

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Preserve EduGeyser's Education NetherNet implementation"
            fi
          else
            echo "preserved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep independent upstream secret-censoring fix
        run: |
          # This change is independent of Geyser's built-in NetherNet transport.
          # Take the full upstream implementation so -X ours cannot silently omit
          # its processor while keeping Education-specific networking untouched.
          git checkout geysermc/master -- core/src/main/java/org/geysermc/geyser/text/AsteriskSerializer.java
          git add core/src/main/java/org/geysermc/geyser/text/AsteriskSerializer.java
          if ! git diff --cached --quiet; then
            git commit -m "Apply upstream secret-censoring improvements"
          fi

      - name: Detect actual tree changes
        id: result
        env:
          BASELINE: ${{ steps.merge.outputs.baseline }}
        run: |
          if git diff --quiet "$BASELINE" HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push generated sync branch
        if: steps.result.outputs.updated == 'true' || steps.nethernet.outputs.preserved == 'true'
        run: git push --force origin HEAD:refs/heads/automation/upstream-sync

      - name: Open sync pull request if needed
        if: github.repository == 'EduGeyser/EduGeyser' && steps.result.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Sync EduGeyser and Geyser upstreams"
          body="$(cat <<'EOF'
          This PR is generated by the upstream synchronization workflow.

          - Merges current EduGeyser and Geyser upstream history.
          - Preserves EduGeyser-specific code at textual conflicts.
          - Keeps EduGeyser's Education NetherNet stack instead of mixing it with Geyser's incompatible built-in transport implementation.
          - Retries merge conflicts with rename detection disabled if necessary.
          - Runs the EduGeyser Gradle build on JDK 27.

          The workflow never pushes to master or auto-merges this PR. If its merge result contains no actual tree changes, no empty PR is opened.
          EOF
          )"
          pr_number="$(gh pr list --state open --head automation/upstream-sync --base master --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            echo "Existing sync PR #$pr_number will update automatically when this branch is pushed."
          elif gh pr create --base master --head automation/upstream-sync --title "$title" --body "$body"; then
            echo "Created sync PR."
          else
            echo "::warning::GitHub Actions cannot create pull requests in this repository. The branch was pushed; enable Actions pull-request creation in repository Settings > Actions > General."
          fi

      - name: Close stale sync PR when already up to date
        if: github.repository == 'EduGeyser/EduGeyser' && steps.result.outputs.updated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --state open --head automation/upstream-sync --base master --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --comment "The current upstream merge adds no tree changes after preserving EduGeyser's Education NetherNet implementation."
          fi

  validate:
    needs: sync
    if: needs.sync.outputs.updated == 'true' || needs.sync.outputs.preserved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out generated sync branch
        uses: actions/checkout@v4
        with:
          ref: automation/upstream-sync
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build EduGeyser
        run: ./gradlew build
